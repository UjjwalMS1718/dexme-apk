name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Create project files
        run: |
          rm -rf proj && mkdir proj && cd proj
          mkdir -p .
          cat > 'settings.gradle' <<'DEXEOF0'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "DEXME"
          include ':app'
          DEXEOF0
          mkdir -p .
          cat > 'build.gradle' <<'DEXEOF1'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'com.google.gms.google-services' version '4.4.2' apply false
          }
          DEXEOF1
          mkdir -p .
          cat > 'gradle.properties' <<'DEXEOF2'
          android.useAndroidX=true
          DEXEOF2
          mkdir -p 'app'
          cat > 'app/build.gradle' <<'DEXEOF3'
          plugins {
              id 'com.android.application'
              id 'com.google.gms.google-services'
          }
          android {
              namespace 'site.dexme.app'
              compileSdk 34
              defaultConfig {
                  applicationId 'site.dexme.app'
                  minSdk 26
                  targetSdk 34
                  versionCode 3
                  versionName '1.2'
              }
              signingConfigs {
                  dexme {
                      storeFile file('../dexme.jks')
                      storePassword 'dexme-ks-2026'
                      keyAlias 'dexme'
                      keyPassword 'dexme-ks-2026'
                  }
              }
              buildTypes {
                  debug { if (file('../dexme.jks').exists()) signingConfig signingConfigs.dexme }
                  release { minifyEnabled false }
              }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies {
              implementation platform('com.google.firebase:firebase-bom:33.1.2')
              implementation 'com.google.firebase:firebase-messaging'
          }
          DEXEOF3
          mkdir -p 'app/src/main'
          cat > 'app/src/main/AndroidManifest.xml' <<'DEXEOF4'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <queries>
                  <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="upi"/></intent>
                  <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="phonepe"/></intent>
                  <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="tez"/></intent>
                  <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="paytmmp"/></intent>
              </queries>
              <application
                  android:label="DEXME"
                  android:icon="@mipmap/ic_launcher"
                  android:allowBackup="false"
                  android:usesCleartextTraffic="false"
                  android:theme="@style/AppTheme">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:launchMode="singleTop"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".PushService" android:exported="false">
                      <intent-filter><action android:name="com.google.firebase.MESSAGING_EVENT"/></intent-filter>
                  </service>
              </application>
          </manifest>
          DEXEOF4
          mkdir -p 'app/src/main/res/values'
          cat > 'app/src/main/res/values/styles.xml' <<'DEXEOF5'
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:statusBarColor">#FFFFFF</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:windowBackground">#FFFFFF</item>
              </style>
              <color name="ic_bg">#6D28D9</color>
          </resources>
          DEXEOF5
          mkdir -p 'app/src/main/res/drawable'
          cat > 'app/src/main/res/drawable/ic_fg.xml' <<'DEXEOF6'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FFFFFF" android:pathData="M34,30h20c13,0 20,8 20,24s-7,24 -20,24h-20z M44,40v28h9c7,0 11,-5 11,-14s-4,-14 -11,-14z" android:fillType="evenOdd"/>
          </vector>
          DEXEOF6
          mkdir -p 'app/src/main/res/drawable'
          cat > 'app/src/main/res/drawable/ic_notif.xml' <<'DEXEOF7'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M7,5h6c3.5,0 5.5,2.4 5.5,7s-2,7 -5.5,7h-6z M10,8v8h3c1.8,0 2.7,-1.3 2.7,-4s-0.9,-4 -2.7,-4z" android:fillType="evenOdd"/>
          </vector>
          DEXEOF7
          mkdir -p 'app/src/main/res/mipmap-anydpi-v26'
          cat > 'app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml' <<'DEXEOF8'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_bg"/>
              <foreground android:drawable="@drawable/ic_fg"/>
          </adaptive-icon>
          DEXEOF8
          mkdir -p 'app/src/main/java/site/dexme/app'
          cat > 'app/src/main/java/site/dexme/app/MainActivity.java' <<'DEXEOF9'
          package site.dexme.app;

          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.net.ConnectivityManager;
          import android.net.NetworkInfo;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.CookieManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import com.google.firebase.messaging.FirebaseMessaging;

          public class MainActivity extends Activity {
              // Aapki live website (user panel). Database isi server se connected rehta hai.
              static final String HOME = "https://dexme.site/";
              static final String HOST = "dexme.site";

              WebView web;
              String fcmToken = null;
              boolean retried = false;

              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  web = new WebView(this);
                  setContentView(web);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setLoadWithOverviewMode(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);
                  // IMPORTANT: site "; wv)" wale WebView ko Chrome par bhej deti hai (boot.js) - isliye hata diya.
                  s.setUserAgentString(s.getUserAgentString().replace("; wv)", ")").replaceAll("Version/\\d+\\.\\d+ ", ""));

                  CookieManager cm = CookieManager.getInstance();
                  cm.setAcceptCookie(true);
                  cm.setAcceptThirdPartyCookies(web, true);

                  web.setWebChromeClient(new WebChromeClient());
                  web.setWebViewClient(new WebViewClient() {
                      @Override public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          return handle(r.getUrl());
                      }
                      @Override public void onPageFinished(WebView v, String url) {
                          CookieManager.getInstance().flush();
                          registerPush();
                          if (!retried) { retried = true; v.postDelayed(new Runnable() { public void run() { registerPush(); } }, 4000); }
                      }
                      @Override public void onReceivedError(WebView v, WebResourceRequest r, WebResourceError e) {
                          if (r.isForMainFrame()) {
                              v.loadData("<html><body style='font-family:sans-serif;text-align:center;padding:60px 20px'>"
                                  + "<h2>No Internet</h2><p>Connection check karein.</p>"
                                  + "<button style='padding:12px 28px;font-size:16px' onclick=\"location.href='" + HOME + "'\">Retry</button>"
                                  + "</body></html>", "text/html", "UTF-8");
                          }
                      }
                  });

                  String start = startUrl(getIntent());
                  if (b != null) web.restoreState(b); else web.loadUrl(start != null ? start : HOME);

                  if (android.os.Build.VERSION.SDK_INT >= 33
                          && checkSelfPermission("android.permission.POST_NOTIFICATIONS") != android.content.pm.PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"}, 1);
                  }
                  try {
                      FirebaseMessaging.getInstance().getToken().addOnSuccessListener(t -> { fcmToken = t; registerPush(); });
                  } catch (Throwable ignored) {}
              }

              // Notification dabane par wahi page khule (history / transactions)
              String startUrl(Intent in) {
                  if (in == null) return null;
                  String nid = in.getStringExtra("nid");
                  if (nid != null && nid.matches("\\d{1,10}")) return HOME + "n.php?i=" + nid;   // admin notification: click count + image/link
                  String p = in.getStringExtra("url");
                  if (p == null || p.isEmpty() || p.startsWith("http") || p.contains("..")) return null;
                  return HOME + p;
              }

              @Override protected void onNewIntent(Intent in) {
                  super.onNewIntent(in);
                  String u = startUrl(in);
                  if (u != null) web.loadUrl(u);
              }

              // Token ko website ke user (cookie) se jod deta hai
              void registerPush() {
                  if (fcmToken == null || web == null) return;
                  String u = web.getUrl();
                  if (u == null || !u.startsWith(HOME)) return;
                  web.evaluateJavascript("fetch('" + HOME + "api.php',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'a=fcm&token='+encodeURIComponent('" + fcmToken + "')}).catch(function(){})", null);
              }

              boolean handle(Uri u) {
                  String sch = u.getScheme() == null ? "" : u.getScheme();
                  if (sch.equals("http") || sch.equals("https")) {
                      if (HOST.equals(u.getHost()) || (u.getHost() != null && u.getHost().endsWith("." + HOST))) return false;
                      return open(new Intent(Intent.ACTION_VIEW, u));   // bahar ki link browser me
                  }
                  if (sch.equals("intent")) {
                      try { return open(Intent.parseUri(u.toString(), Intent.URI_INTENT_SCHEME)); }
                      catch (Exception e) { return true; }
                  }
                  return open(new Intent(Intent.ACTION_VIEW, u));       // upi:// phonepe:// tez:// paytmmp:// wa.me etc.
              }

              boolean open(Intent i) {
                  try { startActivity(i); }
                  catch (ActivityNotFoundException e) { Toast.makeText(this, "App installed nahi hai", Toast.LENGTH_SHORT).show(); }
                  catch (Exception ignored) {}
                  return true;
              }

              @Override protected void onSaveInstanceState(Bundle o) { super.onSaveInstanceState(o); web.saveState(o); }
              @Override protected void onResume() { super.onResume(); web.onResume(); web.evaluateJavascript("window.dispatchEvent(new Event('focus'))", null); }
              @Override protected void onPause() { super.onPause(); CookieManager.getInstance().flush(); web.onPause(); }
              @Override public void onBackPressed() { if (web.canGoBack()) web.goBack(); else super.onBackPressed(); }
          }
          DEXEOF9
          mkdir -p 'app/src/main/java/site/dexme/app'
          cat > 'app/src/main/java/site/dexme/app/PushService.java' <<'DEXEOF10'
          package site.dexme.app;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import com.google.firebase.messaging.FirebaseMessagingService;
          import com.google.firebase.messaging.RemoteMessage;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.Map;

          public class PushService extends FirebaseMessagingService {
              static final String CH = "dexme_updates";

              @Override public void onMessageReceived(RemoteMessage m) {
                  Map<String, String> d = m.getData();
                  String title = d.get("title"), body = d.get("body"), url = d.get("url"), nid = d.get("nid"), image = d.get("image");
                  if (title == null && m.getNotification() != null) { title = m.getNotification().getTitle(); body = m.getNotification().getBody(); }
                  if (title == null) title = "DEXME";
                  if (body == null) body = "";

                  NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                  nm.createNotificationChannel(new NotificationChannel(CH, "Order & Fund updates", NotificationManager.IMPORTANCE_HIGH));

                  Intent i = new Intent(this, MainActivity.class);
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  if (url != null) i.putExtra("url", url);
                  if (nid != null) i.putExtra("nid", nid);
                  int id = (int) (System.currentTimeMillis() & 0x7fffffff);
                  PendingIntent pi = PendingIntent.getActivity(this, id, i, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);

                  Notification.Builder b = new Notification.Builder(this, CH)
                          .setSmallIcon(R.drawable.ic_notif)
                          .setColor(0xFF6D28D9)
                          .setContentTitle(title)
                          .setContentText(body)
                          .setContentIntent(pi)
                          .setAutoCancel(true);

                  Bitmap bmp = (image != null && image.startsWith("http")) ? download(image) : null;
                  if (bmp != null) {
                      b.setLargeIcon(bmp);
                      b.setStyle(new Notification.BigPictureStyle().bigPicture(bmp).bigLargeIcon((Bitmap) null).setSummaryText(body));
                  } else {
                      b.setStyle(new Notification.BigTextStyle().bigText(body));
                  }
                  nm.notify(id, b.build());
              }

              // Image/GIF download (GIF ka pehla frame). Badi image ko chhota karke (max ~1080px) dikhate hain.
              Bitmap download(String u) {
                  try {
                      HttpURLConnection c = (HttpURLConnection) new URL(u).openConnection();
                      c.setConnectTimeout(8000); c.setReadTimeout(12000);
                      InputStream in = c.getInputStream();
                      ByteArrayOutputStream o = new ByteArrayOutputStream();
                      byte[] buf = new byte[16384]; int n; long tot = 0;
                      while ((n = in.read(buf)) > 0) { tot += n; if (tot > 20L * 1024 * 1024) { in.close(); return null; } o.write(buf, 0, n); }
                      in.close();
                      byte[] data = o.toByteArray();
                      BitmapFactory.Options op = new BitmapFactory.Options();
                      op.inJustDecodeBounds = true;
                      BitmapFactory.decodeByteArray(data, 0, data.length, op);
                      int s = 1;
                      while (op.outWidth / s > 1080 || op.outHeight / s > 1620) s *= 2;
                      op = new BitmapFactory.Options();
                      op.inSampleSize = s;
                      return BitmapFactory.decodeByteArray(data, 0, data.length, op);
                  } catch (Throwable t) { return null; }
              }

              @Override public void onNewToken(String token) { /* app khulne par naya token apne aap save ho jata hai */ }
          }
          DEXEOF10
      - name: Add Firebase file (google-services.json)
        run: |
          if [ ! -f google-services.json ]; then echo "ERROR: google-services.json repository ke root me upload karein"; exit 1; fi
          if ! grep -q 'site.dexme.app' google-services.json; then echo "ERROR: Firebase me package name site.dexme.app hona chahiye"; exit 1; fi
          cp google-services.json proj/app/google-services.json
      - name: Signing key (fixed, taaki update purane app par install ho)
        env:
          KS: ${{ secrets.DEXME_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > proj/dexme.jks; echo "Fixed signing key use ho rahi hai"; else echo "WARNING: secret DEXME_KEYSTORE_B64 nahi mila - temporary key (update par purana app hatana padega)"; fi
      - name: Build APK
        run: cd proj && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: DEXME-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release (direct APK download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp proj/app/build/outputs/apk/debug/app-debug.apk DEXME.apk
          gh release create "v${{ github.run_number }}" DEXME.apk --title "DEXME APK v${{ github.run_number }}" --notes "DEXME user panel app"
