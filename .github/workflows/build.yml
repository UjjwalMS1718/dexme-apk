name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Create project files
        run: |
          rm -rf proj && mkdir proj && cd proj
          mkdir -p .
          cat > 'settings.gradle' <<'DEXEOF0'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "DEXME"
          include ':app'
          DEXEOF0
          mkdir -p .
          cat > 'build.gradle' <<'DEXEOF1'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          DEXEOF1
          mkdir -p .
          cat > 'gradle.properties' <<'DEXEOF2'
          android.useAndroidX=true
          DEXEOF2
          mkdir -p 'app'
          cat > 'app/build.gradle' <<'DEXEOF3'
          plugins { id 'com.android.application' }
          android {
              namespace 'site.dexme.app'
              compileSdk 34
              defaultConfig {
                  applicationId 'site.dexme.app'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          DEXEOF3
          mkdir -p 'app/src/main'
          cat > 'app/src/main/AndroidManifest.xml' <<'DEXEOF4'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <queries>
                  <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="upi"/></intent>
                  <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="phonepe"/></intent>
                  <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="tez"/></intent>
                  <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="paytmmp"/></intent>
              </queries>
              <application
                  android:label="DEXME"
                  android:icon="@mipmap/ic_launcher"
                  android:allowBackup="false"
                  android:usesCleartextTraffic="false"
                  android:theme="@style/AppTheme">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          DEXEOF4
          mkdir -p 'app/src/main/res/values'
          cat > 'app/src/main/res/values/styles.xml' <<'DEXEOF5'
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:statusBarColor">#FFFFFF</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:windowBackground">#FFFFFF</item>
              </style>
              <color name="ic_bg">#6D28D9</color>
          </resources>
          DEXEOF5
          mkdir -p 'app/src/main/res/drawable'
          cat > 'app/src/main/res/drawable/ic_fg.xml' <<'DEXEOF6'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FFFFFF" android:pathData="M34,30h20c13,0 20,8 20,24s-7,24 -20,24h-20z M44,40v28h9c7,0 11,-5 11,-14s-4,-14 -11,-14z" android:fillType="evenOdd"/>
          </vector>
          DEXEOF6
          mkdir -p 'app/src/main/res/mipmap-anydpi-v26'
          cat > 'app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml' <<'DEXEOF7'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_bg"/>
              <foreground android:drawable="@drawable/ic_fg"/>
          </adaptive-icon>
          DEXEOF7
          mkdir -p 'app/src/main/java/site/dexme/app'
          cat > 'app/src/main/java/site/dexme/app/MainActivity.java' <<'DEXEOF8'
          package site.dexme.app;

          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.net.ConnectivityManager;
          import android.net.NetworkInfo;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.CookieManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              // Aapki live website (user panel). Database isi server se connected rehta hai.
              static final String HOME = "https://dexme.site/";
              static final String HOST = "dexme.site";

              WebView web;

              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  web = new WebView(this);
                  setContentView(web);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setLoadWithOverviewMode(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);
                  // IMPORTANT: site "; wv)" wale WebView ko Chrome par bhej deti hai (boot.js) - isliye hata diya.
                  s.setUserAgentString(s.getUserAgentString().replace("; wv)", ")").replaceAll("Version/\\d+\\.\\d+ ", ""));

                  CookieManager cm = CookieManager.getInstance();
                  cm.setAcceptCookie(true);
                  cm.setAcceptThirdPartyCookies(web, true);

                  web.setWebChromeClient(new WebChromeClient());
                  web.setWebViewClient(new WebViewClient() {
                      @Override public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          return handle(r.getUrl());
                      }
                      @Override public void onPageFinished(WebView v, String url) { CookieManager.getInstance().flush(); }
                      @Override public void onReceivedError(WebView v, WebResourceRequest r, WebResourceError e) {
                          if (r.isForMainFrame()) {
                              v.loadData("<html><body style='font-family:sans-serif;text-align:center;padding:60px 20px'>"
                                  + "<h2>No Internet</h2><p>Connection check karein.</p>"
                                  + "<button style='padding:12px 28px;font-size:16px' onclick=\"location.href='" + HOME + "'\">Retry</button>"
                                  + "</body></html>", "text/html", "UTF-8");
                          }
                      }
                  });

                  if (b != null) web.restoreState(b); else web.loadUrl(HOME);
              }

              boolean handle(Uri u) {
                  String sch = u.getScheme() == null ? "" : u.getScheme();
                  if (sch.equals("http") || sch.equals("https")) {
                      if (HOST.equals(u.getHost()) || (u.getHost() != null && u.getHost().endsWith("." + HOST))) return false;
                      return open(new Intent(Intent.ACTION_VIEW, u));   // bahar ki link browser me
                  }
                  if (sch.equals("intent")) {
                      try { return open(Intent.parseUri(u.toString(), Intent.URI_INTENT_SCHEME)); }
                      catch (Exception e) { return true; }
                  }
                  return open(new Intent(Intent.ACTION_VIEW, u));       // upi:// phonepe:// tez:// paytmmp:// wa.me etc.
              }

              boolean open(Intent i) {
                  try { startActivity(i); }
                  catch (ActivityNotFoundException e) { Toast.makeText(this, "App installed nahi hai", Toast.LENGTH_SHORT).show(); }
                  catch (Exception ignored) {}
                  return true;
              }

              @Override protected void onSaveInstanceState(Bundle o) { super.onSaveInstanceState(o); web.saveState(o); }
              @Override protected void onResume() { super.onResume(); web.onResume(); web.evaluateJavascript("window.dispatchEvent(new Event('focus'))", null); }
              @Override protected void onPause() { super.onPause(); CookieManager.getInstance().flush(); web.onPause(); }
              @Override public void onBackPressed() { if (web.canGoBack()) web.goBack(); else super.onBackPressed(); }
          }
          DEXEOF8
      - name: Build APK
        run: cd proj && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: DEXME-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release (direct APK download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp proj/app/build/outputs/apk/debug/app-debug.apk DEXME.apk
          gh release create "v${{ github.run_number }}" DEXME.apk --title "DEXME APK v${{ github.run_number }}" --notes "DEXME user panel app"
