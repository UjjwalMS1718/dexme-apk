name: Build Admin APK
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-admin.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Create project files
        run: |
          rm -rf proj && mkdir proj && cd proj
          mkdir -p .
          cat > 'settings.gradle' <<'DEXEOF0'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "DEXME-Admin"
          include ':app'
          DEXEOF0
          mkdir -p .
          cat > 'build.gradle' <<'DEXEOF1'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          DEXEOF1
          mkdir -p .
          cat > 'gradle.properties' <<'DEXEOF2'
          android.useAndroidX=true
          DEXEOF2
          mkdir -p 'app'
          cat > 'app/build.gradle' <<'DEXEOF3'
          plugins { id 'com.android.application' }
          android {
              namespace 'site.dexme.admin'
              compileSdk 34
              defaultConfig {
                  applicationId 'site.dexme.admin'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              signingConfigs {
                  dexme {
                      storeFile file('../dexme.jks')
                      storePassword 'dexme-ks-2026'
                      keyAlias 'dexme'
                      keyPassword 'dexme-ks-2026'
                  }
              }
              buildTypes {
                  debug { if (file('../dexme.jks').exists()) signingConfig signingConfigs.dexme }
                  release { minifyEnabled false }
              }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          DEXEOF3
          mkdir -p 'app/src/main'
          cat > 'app/src/main/AndroidManifest.xml' <<'DEXEOF4'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <application
                  android:label="DEXME Admin"
                  android:icon="@mipmap/ic_launcher"
                  android:allowBackup="false"
                  android:usesCleartextTraffic="false"
                  android:theme="@style/AppTheme">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          DEXEOF4
          mkdir -p 'app/src/main/res/values'
          cat > 'app/src/main/res/values/styles.xml' <<'DEXEOF5'
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:statusBarColor">#4F46E5</item>
                  <item name="android:windowBackground">#F3F4F8</item>
              </style>
              <color name="ic_bg">#111827</color>
          </resources>
          DEXEOF5
          mkdir -p 'app/src/main/res/drawable'
          cat > 'app/src/main/res/drawable/ic_fg.xml' <<'DEXEOF6'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FFFFFF" android:pathData="M54,28L30,80h10l5,-12h18l5,12h10z M48,58l6,-14l6,14z" android:fillType="evenOdd"/>
          </vector>
          DEXEOF6
          mkdir -p 'app/src/main/res/mipmap-anydpi-v26'
          cat > 'app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml' <<'DEXEOF7'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_bg"/>
              <foreground android:drawable="@drawable/ic_fg"/>
          </adaptive-icon>
          DEXEOF7
          mkdir -p 'app/src/main/java/site/dexme/admin'
          cat > 'app/src/main/java/site/dexme/admin/MainActivity.java' <<'DEXEOF8'
          package site.dexme.admin;

          import android.app.Activity;
          import android.app.DownloadManager;
          import android.content.ActivityNotFoundException;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.webkit.CookieManager;
          import android.webkit.URLUtil;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              // Admin panel (sirf aapke liye). Login ke bina kuch nahi khulta.
              static final String HOME = "https://dexme.site/admin/";
              static final String HOST = "dexme.site";
              static final int FILE_REQ = 77;

              WebView web;
              ValueCallback<Uri[]> fileCb;

              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  web = new WebView(this);
                  setContentView(web);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setLoadWithOverviewMode(true);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);

                  CookieManager cm = CookieManager.getInstance();
                  cm.setAcceptCookie(true);
                  cm.setAcceptThirdPartyCookies(web, true);

                  // Image / file upload (banner, notification image) ke liye file chooser
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override public boolean onShowFileChooser(WebView w, ValueCallback<Uri[]> cb, FileChooserParams p) {
                          if (fileCb != null) fileCb.onReceiveValue(null);
                          fileCb = cb;
                          try { startActivityForResult(p.createIntent(), FILE_REQ); }
                          catch (Exception e) { fileCb = null; return false; }
                          return true;
                      }
                  });

                  // Download (database backup etc.)
                  web.setDownloadListener((url, ua, cd, mime, len) -> {
                      try {
                          DownloadManager.Request r = new DownloadManager.Request(Uri.parse(url));
                          r.addRequestHeader("Cookie", CookieManager.getInstance().getCookie(url));
                          r.addRequestHeader("User-Agent", ua);
                          r.setMimeType(mime);
                          r.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                          r.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, URLUtil.guessFileName(url, cd, mime));
                          ((DownloadManager) getSystemService(Context.DOWNLOAD_SERVICE)).enqueue(r);
                          Toast.makeText(this, "Download shuru - Downloads folder me milega", Toast.LENGTH_LONG).show();
                      } catch (Exception e) {
                          Toast.makeText(this, "Download nahi ho paya", Toast.LENGTH_SHORT).show();
                      }
                  });

                  web.setWebViewClient(new WebViewClient() {
                      @Override public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          Uri u = r.getUrl();
                          String sch = u.getScheme() == null ? "" : u.getScheme();
                          if ((sch.equals("http") || sch.equals("https")) && u.getHost() != null
                                  && (HOST.equals(u.getHost()) || u.getHost().endsWith("." + HOST))) return false;
                          try { startActivity(new Intent(Intent.ACTION_VIEW, u)); }
                          catch (ActivityNotFoundException e) { Toast.makeText(MainActivity.this, "Open nahi ho paya", Toast.LENGTH_SHORT).show(); }
                          return true;
                      }
                      @Override public void onPageFinished(WebView v, String url) { CookieManager.getInstance().flush(); }
                      @Override public void onReceivedError(WebView v, WebResourceRequest r, WebResourceError e) {
                          if (r.isForMainFrame()) {
                              v.loadData("<html><body style='font-family:sans-serif;text-align:center;padding:60px 20px'>"
                                  + "<h2>No Internet</h2><p>Connection check karein.</p>"
                                  + "<button style='padding:12px 28px;font-size:16px' onclick=\"location.href='" + HOME + "'\">Retry</button>"
                                  + "</body></html>", "text/html", "UTF-8");
                          }
                      }
                  });

                  if (b != null) web.restoreState(b); else web.loadUrl(HOME);
              }

              @Override protected void onActivityResult(int req, int res, Intent data) {
                  if (req == FILE_REQ) {
                      if (fileCb != null) { fileCb.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(res, data)); fileCb = null; }
                      return;
                  }
                  super.onActivityResult(req, res, data);
              }

              @Override protected void onSaveInstanceState(Bundle o) { super.onSaveInstanceState(o); web.saveState(o); }
              @Override protected void onPause() { super.onPause(); CookieManager.getInstance().flush(); web.onPause(); }
              @Override protected void onResume() { super.onResume(); web.onResume(); }
              @Override public void onBackPressed() { if (web.canGoBack()) web.goBack(); else super.onBackPressed(); }
          }
          DEXEOF8
      - name: Signing key (same fixed key)
        env:
          KS: ${{ secrets.DEXME_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > proj/dexme.jks; echo "Fixed signing key use ho rahi hai"; else echo "WARNING: secret DEXME_KEYSTORE_B64 nahi mila - temporary key"; fi
      - name: Build APK
        run: cd proj && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: DEXME-Admin-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release (direct APK download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp proj/app/build/outputs/apk/debug/app-debug.apk DEXME-Admin.apk
          gh release create "admin-v${{ github.run_number }}" DEXME-Admin.apk --title "DEXME ADMIN APK v${{ github.run_number }}" --notes "DEXME admin panel app (sirf owner ke liye)"
